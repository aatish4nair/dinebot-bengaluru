<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DineBot Bengaluru</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #51121a;
      color: #241820;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    .container {
      max-width: 1020px;
      margin: 0 auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      text-align: center;
      color: #fff;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 20px;
      font-weight: 400;
    }

    /* =========================
       FILTER PANEL
    ========================= */

    .filter-card {
      background: #f7eeee;
      border-radius: 24px;
      padding: 34px 40px 32px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px 26px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field label {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      height: 58px;
      border: 1px solid #e2cfd2;
      border-radius: 13px;
      background: #faf4f4;
      padding: 0 20px;
      font-size: 18px;
      color: #34272d;
      outline: none;
      cursor: pointer;
      appearance: auto;
    }

    select:focus {
      border-color: #8d2634;
      box-shadow: 0 0 0 2px rgba(141, 38, 52, 0.12);
    }

    /* =========================
       BUTTON
    ========================= */

    .button-container {
      display: flex;
      justify-content: center;
      margin-top: 29px;
    }

    .recommend-btn {
      background: #8d2634;
      color: #fff;
      border: none;
      border-radius: 13px;
      padding: 15px 52px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      min-width: 310px;
      box-shadow: 0 7px 12px rgba(0, 0, 0, 0.18);
      transition: all 0.2s ease;
    }

    .recommend-btn:hover {
      background: #761f2c;
      transform: translateY(-1px);
    }

    .recommend-btn:active {
      transform: translateY(1px);
    }

    .recommend-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       RECOMMENDATIONS HEADER
    ========================= */

    .recommendations {
      margin-top: 28px;
    }

    .recommendations-title {
      text-align: center;
      color: #fff;
      font-size: 27px;
      font-weight: 700;
      margin-bottom: 27px;
      position: relative;
    }

    .decorative-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 12px;
    }

    .decorative-line::before,
    .decorative-line::after {
      content: "";
      width: 82px;
      height: 2px;
      background: #e8a6ad;
    }

    .diamond {
      width: 10px;
      height: 10px;
      background: #e8a6ad;
      transform: rotate(45deg);
    }

    /* =========================
       RECOMMENDATION GRID
    ========================= */

    .recommendation-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .restaurant-card {
      background: #f7eeee;
      border-radius: 21px;
      padding: 25px 30px 28px;
      min-height: 305px;
    }

    .restaurant-title {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* Title row: keeps the existing title on the left and lets the compact
       Get Directions pill sit at the top-right of the card. */
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header .restaurant-title {
      flex: 1;
      min-width: 0;
    }

    .directions-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #8d2634;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .directions-btn:hover {
      background: #761f2c;
      transform: translateY(-1px);
    }

    .directions-btn:active {
      transform: translateY(1px);
    }

    .directions-btn:focus-visible {
      outline: 2px solid #8d2634;
      outline-offset: 2px;
    }

    .directions-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      display: block;
    }

    /* =========================
       RATING
    ========================= */

    .rating {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .stars {
      display: flex;
      gap: 2px;
      font-size: 22px;
      line-height: 1;
    }

    .star-filled {
      color: #f4a825;
    }

    .star-empty {
      color: #b8a9ac;
    }

    .rating-text {
      font-size: 17px;
      font-weight: 600;
      margin-left: 5px;
    }

    /* =========================
       RESTAURANT DETAILS
    ========================= */

    .detail {
      font-size: 17px;
      margin-bottom: 13px;
      line-height: 1.4;
    }

    .detail strong {
      font-weight: 700;
    }

    .restaurant-description {
      border-top: 1px solid #dfcbcf;
      padding-top: 18px;
      margin-top: 20px;
      font-size: 17px;
      line-height: 1.45;
    }

    /* =========================
       STATUS MESSAGES (loading / empty / error)
    ========================= */

    .status-message {
      text-align: center;
      color: #fff;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 13px;
      padding: 20px;
    }

    .status-message.error {
      background: rgba(0, 0, 0, 0.2);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 750px) {

      body {
        padding: 28px 15px 50px;
      }

      .header h1 {
        font-size: 30px;
      }

      .header p {
        font-size: 17px;
      }

      .filter-card {
        padding: 25px 20px;
      }

      .filter-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .recommendation-grid {
        grid-template-columns: 1fr;
      }

      .recommend-btn {
        width: 100%;
        min-width: 0;
      }

      .restaurant-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">
      <h1>DineBot Bengaluru 🍲📍🤖</h1>
      <p>Choose your preferences and get your recommendations.</p>
    </header>


    <!-- =========================
         FILTER FORM
    ========================== -->

    <section class="filter-card">

      <div class="filter-grid">

        <!-- Place -->
        <div class="field">
          <label for="place">Place</label>

          <select id="place">
            <option value="">Choose a place</option>
            {% for p in places %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>


        <!-- Price -->
        <div class="field">
          <label for="price">Price Range</label>

          <select id="price">
            <option value="">Choose a price-range</option>
            {% for opt in price_options %}
            <option value="{{ opt }}">{{ opt }}</option>
            {% endfor %}
          </select>
        </div>


        <!-- Rating -->
        <div class="field">
          <label for="rating">Hotel Ratings</label>

          <select id="rating">
            <option value="">Choose a rating</option>
            {% for opt in rating_options %}
            <option value="{{ opt }}">{{ opt }}</option>
            {% endfor %}
          </select>
        </div>


        <!-- Cuisine -->
        <div class="field">
          <label for="cuisine">Cuisines</label>

          <select id="cuisine">
            <option value="">Choose a cuisine</option>
            {% for c in cuisines %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>

      </div>


      <!-- Recommendation Button -->

      <div class="button-container">
        <button
          id="recommend-btn"
          class="recommend-btn"
          onclick="getRecommendations()"
        >
          Get recommendations
        </button>
      </div>

    </section>


    <!-- =========================
         RECOMMENDATIONS
    ========================== -->

    <section class="recommendations" id="recommendations-section" style="display: none;">

      <h2 class="recommendations-title">
        Top recommendations

        <div class="decorative-line">
          <span class="diamond"></span>
        </div>
      </h2>

      <div class="recommendation-grid" id="recommendation-grid">
      </div>

    </section>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    function starsHtml(rating) {
      const value = typeof rating === "number" ? rating : 0;
      const filled = Math.max(0, Math.min(5, Math.round(value)));
      let html = "";
      for (let i = 0; i < 5; i++) {
        html += `<span class="${i < filled ? "star-filled" : "star-empty"}">${i < filled ? "★" : "☆"}</span>`;
      }
      return html;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }

    // Get Directions pill. Rendered only for outlets that have a real
    // destination - delivery-only and address-less records get no button at
    // all, not a disabled or invisible one. The href is the plain Google Maps
    // URL the server built from this card's own address; clicking it is the
    // only moment any Google service is contacted.
    function directionsButtonHtml(rec) {
      if (rec.navigation_ready !== true || !rec.directions_url) return "";
      const pin = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>`;
      return `
        <a class="directions-btn"
           href="${escapeHtml(rec.directions_url)}"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Get directions to ${escapeHtml(rec.name)}">
          ${pin}Get Directions
        </a>
      `;
    }

    function cardHtml(rec) {
      const ratingText = typeof rec.rating === "number" ? rec.rating.toFixed(1) : "N/A";
      const costText = typeof rec.cost === "number" ? `₹${Math.round(rec.cost)}` : "N/A";
      const cuisines = (rec.cuisines || []).join(", ") || "N/A";

      return `
        <article class="restaurant-card">
          <div class="card-header">
            <h3 class="restaurant-title">${rec.rank}. ${escapeHtml(rec.name)}</h3>
            ${directionsButtonHtml(rec)}
          </div>

          <div class="rating">
            <div class="stars">${starsHtml(rec.rating)}</div>
            <span class="rating-text">Rating: ${ratingText}</span>
          </div>

          <p class="detail"><strong>Place:</strong> ${escapeHtml(rec.place)} | ${costText}</p>
          <p class="detail"><strong>Cuisines:</strong> ${escapeHtml(cuisines)}</p>
          <p class="detail"><strong>Location:</strong> ${escapeHtml(rec.location)}</p>

          <p class="restaurant-description">${escapeHtml(rec.explanation)}</p>
        </article>
      `;
    }

    function showRecommendationsSection() {
      document.getElementById("recommendations-section").style.display = "block";
    }

    function renderMessage(message, isError) {
      showRecommendationsSection();
      const grid = document.getElementById("recommendation-grid");
      grid.style.gridTemplateColumns = "1fr";
      grid.innerHTML = `<div class="status-message${isError ? " error" : ""}">${escapeHtml(message)}</div>`;
    }

    function renderRecommendations(recs) {
      showRecommendationsSection();
      const grid = document.getElementById("recommendation-grid");
      if (!recs.length) {
        grid.style.gridTemplateColumns = "1fr";
        grid.innerHTML = '<div class="status-message">No recommendations found. Try relaxing your filters (place, rating, price, or cuisine).</div>';
        return;
      }
      grid.style.gridTemplateColumns = "";
      grid.innerHTML = recs.map(cardHtml).join("");
    }

    async function getRecommendations() {
      const place = document.getElementById("place").value;
      const price = document.getElementById("price").value;
      const rating = document.getElementById("rating").value;
      const cuisine = document.getElementById("cuisine").value;

      const btn = document.getElementById("recommend-btn");
      btn.disabled = true;
      btn.textContent = "Finding restaurants...";
      renderMessage("Fetching recommendations...", false);

      try {
        const response = await fetch("/api/recommendations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ place, price, rating, cuisine }),
        });

        const data = await response.json();

        if (!response.ok) {
          renderMessage(data.error || "Something went wrong. Please try again.", true);
          return;
        }

        renderRecommendations(data.recommendations || []);
      } catch (err) {
        renderMessage("Could not reach the recommendation service. Please try again.", true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Get recommendations";
      }
    }

  </script>

</body>
</html>
